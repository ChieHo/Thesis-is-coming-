<!DOCTYPE html>
<html lang="de" th:fragment="layout(content)">
<head>
    <meta charset="UTF-8">
    <title>Header</title>

<body class="container">
<div th:fragment="theme">
    <button aria-label="Toggle Theme" class="secondary outline" data-placement="left" data-tooltip="Toggle Theme"
            id="theme-button">Toggle Theme
    </button>
    <script>
        // Sofort beim Parsen ausführen (Button steht bereits im DOM)
        (function () {
            function current() {
                return JSON.parse(localStorage.getItem("theme") ?? String(matchMedia('(prefers-color-scheme: dark)').matches));
            }
            function toggleTheme() {
                localStorage.setItem("theme", String(!current()));
                applyTheme();
            }
            function applyTheme() {
                document.documentElement.setAttribute("data-theme", current() ? "dark" : "light");
                const btn = document.getElementById("theme-button");
                if (btn) btn.innerText = current() ? "🌙" : "☀️";
            }

            const btn = document.getElementById("theme-button");
            if (btn) btn.onclick = toggleTheme;
            applyTheme();
        })();
    </script>
</div>
